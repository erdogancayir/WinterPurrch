name: Release

# Push a tag such as v0.2.0 to build the disk image and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the disk image
        run: scripts/make-dmg.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/WinterPurrch-*.dmg --title "WinterPurrch $GITHUB_REF_NAME" --generate-notes
